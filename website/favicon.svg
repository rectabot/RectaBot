<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- RectaBot Favicon — simplified for 16px-64px sizes -->
  <defs>
    <style>
      @font-face {
        font-family: 'Orbitron';
        font-weight: 900;
        font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2');
      }
    </style>
  </defs>
  <!-- One rounded corner, top left, at the radius the letter's own elbow is drawn
