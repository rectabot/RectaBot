name: 💡 Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea! We'll consider every reasonable request.

  - type: dropdown
    id: component
    attributes:
      label: Which component?
      options:
        - Hardware
        - Firmware
        - Web Configurator
        - Documentation
        - RectaPad (pendant)
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case and pain point
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: priority
    attributes:
      label: How critical is this for you?
      options:
        - Nice to have
        - Important
        - Blocker (cannot use product without)
    validations:
      required: true

  - type: textarea
    id: machine
    attributes:
      label: Your CNC machine (helps prioritize)
      placeholder: e.g., 1500x1000mm router with Huanyang VFD, 5-axis with rotary
