name: Deploy website to GitHub Pages

# Publishes the static site in website/ to GitHub Pages. The site's CNAME
# (website/CNAME = rectabot.org) sets the custom domain. Runs on pushes to main
# that touch the site, and can be triggered manually. Requires the repo to be
# public (or GitHub Pro) with Pages set to "GitHub Actions" as the source.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./website
      - id: deployment
        uses: actions/deploy-pages@v4
