<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- RectaBot Icon — Light version for white backgrounds -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&amp;display=swap');
      .rb-icon { font-family: 'Orbitron', 'Bahnschrift', 'Eurostile', sans-serif; font-weight: 900; }
    </style>
  </defs>

  <!-- Cyan rounded square background -->
  <rect width="256" height="256" rx="32" ry="32" fill="#22d3ee"/>

  <!-- Lowercase "r" centered, dark -->
  <text x="128" y="200" text-anchor="middle" class="rb-icon"
        font-size="220" fill="#020617">r</text>
</svg>
