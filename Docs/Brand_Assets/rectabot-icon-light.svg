<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- RectaBot Icon — Light version for white backgrounds -->
  <defs>
    <style>
      @font-face {
        font-family: 'Orbitron';
        font-weight: 900;
        font-style: normal;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      .rb-icon { font-family: 'Orbitron', 'Bahnschrift', 'Eurostile', sans-serif; font-weight: 900; }
    </style>
  </defs>

  <!-- Cyan background with one rounded corner, top left, at the radius the letter's
       own elbow is drawn with (16.1% of the edge). Matches rectabot-icon-cyan.svg. -->
  <path d="M41.25,0 H256 V256 H0 V41.25 A41.25,41.25 0 0 1 41.25,0 Z" fill="#22d3ee"/>

  <!-- Lowercase "r" centered, dark -->
  <text x="128.23" y="208.55" text-anchor="middle" class="rb-icon"
        font-size="273.14" fill="#020617">r</text>
</svg>
